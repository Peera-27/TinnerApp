<h3 mat-dialog-title>Add a photo</h3>

<mat-dialog-content>
  <input #filePicker type="file" class="hidden-input" (change)="onImgpicked($event)" accept=".jpg,.jpeg,.png" />

  @if (!imgPreview()) {
  <div class="dropzone" [class.is-dragging]="dragging()" (dragover)="onDragOver($event)" (dragleave)="onDragLeave()"
    (drop)="onDrop($event)" (click)="filePicker.click()" role="button" tabindex="0"
    (keydown.enter)="filePicker.click()">
    <span class="dropzone__icon"><mat-icon>cloud_upload</mat-icon></span>
    <strong>Drop an image here</strong>
    <span class="dropzone__hint">or click to browse — JPG or PNG, up to 5&nbsp;MB</span>
  </div>
  } @else {
  <figure class="preview">
    <img [src]="imgPreview()" alt="Preview of the photo you are about to upload" />
    <figcaption>
      <div>
        <strong>{{ imgFile()?.name }}</strong>
        <small>{{ formatSize(imgFile()?.size ?? 0) }}</small>
      </div>
      <button type="button" class="swap" (click)="filePicker.click()">
        <mat-icon>swap_horiz</mat-icon> Choose another
      </button>
    </figcaption>
  </figure>
  }

  @if (errMessage()) {
  <p class="error" role="alert"><mat-icon>error</mat-icon>{{ errMessage() }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button class="tn-btn-gradient" type="button" (click)="onSubmit()" [disabled]="!imgFile()">
    Upload photo
  </button>
</mat-dialog-actions>
