<div class="tn-page tn-page--wide">
  <header class="tn-page-head">
    <div>
      <h1>Your followers</h1>
      <p>People who tapped the heart on your profile.</p>
    </div>

    <span class="count-pill">
      <mat-icon>group</mat-icon>
      <strong>{{ followers().pagination.length ?? 0 }}</strong> followers
    </span>
  </header>

  <app-filter-bar [pagination]="followers().pagination" (search)="onSearch()" (resetFilters)="onReset()" />

  @if (followers().items.length > 0) {
  <div class="list-grid">
    @for (member of followers().items; track member.id) {
    <app-member-card [member]="member" />
    }
  </div>

  <div class="list-foot">
    <mat-paginator [length]="followers().pagination.length" [pageSize]="followers().pagination.pageSize"
      [pageIndex]="(followers().pagination.currentPage ?? 1) - 1" [pageSizeOptions]="pageSize"
      aria-label="Select page" (page)="onPageChnage($event)" />
  </div>
  } @else {
  <div class="list-empty">
    <app-empty-state icon="favorite" heading="No followers yet"
      message="Add a couple of photos and fill in your introduction — profiles that feel complete get noticed first.">
      <button mat-flat-button class="tn-btn-gradient" routerLink="/profile">Polish my profile</button>
    </app-empty-state>
  </div>
  }
</div>
