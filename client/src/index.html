<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Tinner — find your match</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Tinner — meet people who are looking for the same thing you are.">
  <meta name="theme-color" content="#ff4d6d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0c13" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* Painted before Angular boots so the first frame is never a white flash. */
    .app-boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #fdf7fa;
    }

    .app-boot span {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4d6d, #c44bff);
      animation: app-boot-beat 1.1s cubic-bezier(.22, 1, .36, 1) infinite;
    }

    @keyframes app-boot-beat {

      0%,
      100% {
        transform: scale(1);
        opacity: .85;
      }

      50% {
        transform: scale(1.25);
        opacity: 1;
      }
    }

    @media (prefers-color-scheme: dark) {
      .app-boot {
        background: #0e0c13;
      }
    }
  </style>
</head>

<body class="mat-typography">
  <app-root>
    <div class="app-boot"><span></span></div>
  </app-root>
</body>

</html>
