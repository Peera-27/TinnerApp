<div class="oops">
  <div class="oops__art" aria-hidden="true">
    <span class="glow"></span>
    <span class="code">404</span>
    <span class="heart"><mat-icon>heart_broken</mat-icon></span>
  </div>

  <h1>This one got away</h1>
  <p>The page you are after has been moved, deleted, or never existed in the first place.</p>

  <div class="oops__actions">
    <a class="btn btn--primary" routerLink="/">
      <mat-icon>explore</mat-icon> Back to Discover
    </a>
    <button type="button" class="btn btn--ghost" (click)="back()">
      <mat-icon>arrow_back</mat-icon> Go back
    </button>
  </div>
</div>
