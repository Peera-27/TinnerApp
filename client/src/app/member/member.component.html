<div class="tn-page tn-page--wide">
  <header class="tn-page-head">
    <div>
      <h1>Discover</h1>
      <p>Browse people who are looking for what you are looking for.</p>
    </div>

    <span class="count-pill">
      <mat-icon>groups</mat-icon>
      <strong>{{ paginator().pagination.length ?? 0 }}</strong> people found
    </span>
  </header>

  <app-filter-bar [pagination]="paginator().pagination" (search)="onSearch()" (resetFilters)="onReset()" />

  @if (paginator().items.length > 0) {
  <div class="list-grid">
    @for (member of paginator().items; track member.id) {
    <app-member-card [member]="member" />
    }
  </div>

  <div class="list-foot">
    <mat-paginator [length]="paginator().pagination.length" [pageSize]="paginator().pagination.pageSize"
      [pageIndex]="(paginator().pagination.currentPage ?? 1) - 1" [pageSizeOptions]="pageSize"
      aria-label="Select page" (page)="onPageChnage($event)" />
  </div>
  } @else {
  <div class="list-empty">
    <app-empty-state icon="person_search" heading="Nobody matches those filters"
      message="Try widening the age range, or clear the filters to see everyone on Tinner.">
      <button mat-flat-button class="tn-btn-gradient" (click)="onReset()">Clear filters</button>
    </app-empty-state>
  </div>
  }
</div>
