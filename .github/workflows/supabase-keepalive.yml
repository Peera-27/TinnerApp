name: Supabase keep-alive

on:
  schedule:
    - cron: "0 2 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TinnerApp2
            url_secret: SUPABASE_URL
            key_secret: SUPABASE_ANON_KEY
          - name: Project2
            url_secret: SUPABASE_URL_2
            key_secret: SUPABASE_ANON_KEY_2
    steps:
      - name: Query Supabase (${{ matrix.name }})
        env:
          RAW_URL: ${{ secrets[matrix.url_secret] }}
          RAW_KEY: ${{ secrets[matrix.key_secret] }}
        run: |
          URL=$(printf '%s' "$RAW_URL" | tr -d '[:space:]')
          KEY=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')
          URL="${URL%/}"
          URL="${URL%/rest/v1}"

          if [ -z "$URL" ]; then echo "${{ matrix.url_secret }} ว่างอยู่ หรือชื่อ secret ไม่ตรง"; exit 1; fi
          if [ -z "$KEY" ]; then echo "${{ matrix.key_secret }} ว่างอยู่ หรือชื่อ secret ไม่ตรง"; exit 1; fi

          curl -fsS "$URL/rest/v1/keep_alive?select=id&limit=1" -H "apikey: $KEY"
