<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="No photo yet">
  <!--
    Drawn at 4:5 — the aspect every member card and swipe card uses — so it is
    never cropped, and it carries its own plate so a card with no photo reads as
    a deliberate placeholder rather than a broken image. The mark sits above
    centre to stay clear of the scrim that cards lay over the bottom third.
  -->
  <defs>
    <linearGradient id="tn-ph-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f0f7" />
      <stop offset="1" stop-color="#e6deeb" />
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#tn-ph-bg)" />
  <g transform="translate(150 235) scale(.5)" fill="#c7bed3">
    <circle cx="500" cy="336" r="196" />
    <path d="M166 798C169 653 307 538 500 538C693 538 831 653 834 798C836 886 693 947 500 947C307 947 164 886 166 798Z" />
  </g>
</svg>
