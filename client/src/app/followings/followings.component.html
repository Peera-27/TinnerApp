<div class="tn-page tn-page--wide">
  <header class="tn-page-head">
    <div>
      <h1>People you follow</h1>
      <p>Everyone you have hearted. Tap the heart again to remove someone.</p>
    </div>

    <span class="count-pill">
      <mat-icon>favorite</mat-icon>
      <strong>{{ following().pagination.length ?? 0 }}</strong> following
    </span>
  </header>

  <app-filter-bar [pagination]="following().pagination" (search)="onSearch()" (resetFilters)="onReset()" />

  @if (following().items.length > 0) {
  <div class="list-grid">
    @for (member of following().items; track member.id) {
    <app-member-card [member]="member" />
    }
  </div>

  <div class="list-foot">
    <mat-paginator [length]="following().pagination.length" [pageSize]="following().pagination.pageSize"
      [pageIndex]="(following().pagination.currentPage ?? 1) - 1" [pageSizeOptions]="pageSize"
      aria-label="Select page" (page)="onPageChnage($event)" />
  </div>
  } @else {
  <div class="list-empty">
    <app-empty-state icon="explore" heading="You have not followed anyone yet"
      message="Head over to Discover and tap the heart on the people you would like to hear from.">
      <button mat-flat-button class="tn-btn-gradient" routerLink="/">Start discovering</button>
    </app-empty-state>
  </div>
  }
</div>
