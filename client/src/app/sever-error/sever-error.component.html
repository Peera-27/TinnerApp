<div class="oops">
  <span class="oops__icon"><mat-icon>cloud_off</mat-icon></span>

  <p class="oops__code">Error {{ code }}</p>
  <h1>Something broke on our side</h1>
  <p class="oops__msg">{{ message }}</p>

  <div class="oops__actions">
    <button type="button" class="btn btn--primary" (click)="retry()">
      <mat-icon>refresh</mat-icon> Try again
    </button>
    <a class="btn btn--ghost" routerLink="/">
      <mat-icon>home</mat-icon> Back home
    </a>
  </div>

  <button type="button" class="details-toggle" (click)="showDetails = !showDetails">
    {{ showDetails ? 'Hide' : 'Show' }} technical details
    <mat-icon>{{ showDetails ? 'expand_less' : 'expand_more' }}</mat-icon>
  </button>

  @if (showDetails) {
  <pre class="details">{{ details }}</pre>
  }
</div>
